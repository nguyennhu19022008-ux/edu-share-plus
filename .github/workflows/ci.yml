name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, edu-share-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  local-auth-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, edu-share-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Clean stale local Supabase
        run: npx supabase stop --no-backup || true

      - name: Start local Supabase
        run: npx supabase start

      - name: Export local Supabase credentials
        shell: bash
        run: |
          npx supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" >> "$GITHUB_ENV"

      - name: Local email-confirmation E2E
        run: node tests/localAuthConfirmation.e2e.mjs

      - name: Phase 5B full integration matrix
        run: node scripts/test-roster-registration-trust.mjs

      - name: Phase 5C marketplace read matrix
        run: node tests/marketplaceRead.e2e.mjs

      - name: Phase 5D profile backend matrix
        run: node tests/profileBackend.e2e.mjs

      - name: Phase 5E owner post write matrix
        run: node tests/ownerPostWrite.e2e.mjs

      - name: Phase 5E owner post read matrix
        run: node tests/ownerPostRead.e2e.mjs

      - name: Phase 5F private storage matrix
        run: node tests/storageBackend.e2e.mjs

      - name: Phase 5G favorites matrix
        run: node tests/favoritesBackend.e2e.mjs

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
